<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Bot AI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chatbox { width: 100%; height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; }
    #userInput { width: 80%; padding: 8px; }
    #send { padding: 8px 12px; cursor: pointer; }
    table { border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid #ccc; padding: 6px; }
  </style>
</head>
<body>
  <h2>🎓 College Admission Assistant</h2>
  <div id="chatbox"></div>
  <input id="userInput" type="text" placeholder="Ask about colleges...">
  <button id="send">Send</button>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("send");

    // Append messages
    function appendMessage(sender, message) {
      const div = document.createElement("div");
      div.innerHTML = `<b>${sender}:</b> ${message}`;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    // Send message function
    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return; // Prevent empty messages

      appendMessage("You", message);
      userInput.value = "";

      try {
        const response = await fetch("/get", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await response.json();
        appendMessage("Bot", data.response);
      } catch (err) {
        appendMessage("Bot", "⚠️ Error connecting to server.");
      }
    }

    // ✅ Send on button click
    sendBtn.addEventListener("click", sendMessage);

    // ✅ Send on Enter key
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault(); // avoid new line
        sendMessage();
      }
    });
  </script>
</body>
</html>
